{% load static %}
<!doctype html>
<html dir="rtl" lang="fa-IR">

<head>
    <title>{% block title %}محمد مقدم‌نژاد{% endblock %}</title>
    <meta charset="UTF-8" />
    <script>
        if (localStorage.getItem("theme") === "dark")
            document.documentElement.classList.add("dark-theme");
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Premium portfolio of Alex Sterling, an Elite Design Systems Architect." />
    <link rel="icon" href="{% static 'img/favicon.svg' %}" type="image/svg+xml" />

    <!-- CSS LIBRARIES -->
    <link rel="stylesheet" href="{% static 'css/bootstrap.rtl.min.css' %}" />
    <link rel="stylesheet" href="{% static 'css/fontawesome.min.css' %}" />
    <link rel="stylesheet" href="{% static 'css/animate.min.css' %}" />
    <link rel="stylesheet" href="{% static 'css/google-fonts.css' %}" />
    <link rel="stylesheet" href="{% static 'css/main.css' %}" />
    <link rel="stylesheet" href="{% static 'css/main-rtl.css' %}" />
    {% block extra_css %} {% endblock %}


</head>

<body>


    <div class="container bento-container">

        <!-- START NAVIGATION DOCK -->
        {% include "includes/navigation.html" %}

        <!-- END NAVIGATION DOCK -->

        <!-- START HEADER -->
        {% include "includes/header.html" %}
        <!-- END HEADER -->


        {% block content %}
        {% endblock %}


        <!-- START FOOTER -->
        {% include "includes/footer.html" %}

        <!-- END FOOTER -->
    </div>

    <!-- JS LIBRARIES -->
    <script src="{% static 'js/jquery.min.js' %}"></script>
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
    <script src="{% static 'js/wow.min.js' %}"></script>
    <script src="{% static 'js/main.js' %}"></script>
    {% block extra_js %} {% endblock %}


</body>

</html>
